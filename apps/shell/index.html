<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="theme-color" content="#f6f7f2" />
        <title>Micro Frontend | Hamzeen</title>
        <script>
            const restoredPath = sessionStorage.getItem("mfe:github-pages-path");
            if (restoredPath) {
                sessionStorage.removeItem("mfe:github-pages-path");
                history.replaceState(null, "", restoredPath);
            }
        </script>
    </head>
    <body>
        <div id="root"></div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
